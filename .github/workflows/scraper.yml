# OPTION A — the archive (data/mediapulse.db) is stored in the repo via Git LFS.
# Simplest setup: no accounts or secrets beyond NEWS_API_KEY (optional).
# Limit: every run commits a new copy of the database to LFS. Move to Option B
# before data/mediapulse.db reaches ~100 MB, or the LFS quota runs out.
name: MediaPulse crawl

on:
  schedule:
    - cron: "17 3,15 * * *"     # 06:17 and 18:17 Nairobi time (UTC+3)
  workflow_dispatch:

concurrency:
  group: mediapulse-crawl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-24.04        # pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026
    timeout-minutes: 175
    env:
      MP_USER_AGENT: "MediaPulseBot/5.0 (+https://mediapulse.africa/bot; bot@mediapulse.africa)"  # use your real URL/email
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Preflight — check the repo layout
        run: |
          ok=1
          for f in scraper.py ingest.py requirements.txt; do
            [ -f "$f" ] || { echo "::error::$f is missing from the repo root (did the files land inside a subfolder like option-A-git/ or option-B-r2/?)"; ok=0; }
          done
          [ $ok = 1 ] || exit 1
          grep -q "PART 3 — PIPELINE" scraper.py || { echo "::error::scraper.py is still the old version — replace it with the new merged scraper.py"; exit 1; }
          grep -q "import-legacy" ingest.py || { echo "::error::ingest.py is the old version (no --import-legacy) — replace it with the new ingest.py"; exit 1; }
          python -c "import scraper, ingest" || { echo "::error::scraper.py / ingest.py failed to import — see the traceback above"; exit 1; }
          echo "Layout OK"

      - name: Import the v3 CSV into the archive (runs once, then skips itself)
        run: |
          if [ -f data/legacy_daily_news_v3.csv ]; then
            python ingest.py --import-legacy data/legacy_daily_news_v3.csv
          fi

      - name: Crawl
        id: crawl
        timeout-minutes: 140         # hard stop; the crawler itself stops at MP_TIME_BUDGET_MIN
        env:
          MP_TIME_BUDGET_MIN: "110"  # minutes of crawling per run; unfetched URLs carry over to the next run
        run: |
          rm -f data/pipeline.log      # start a fresh log so the check below only sees this run
          python scraper.py

      - name: Flush database to a single file
        if: always() && steps.crawl.outcome != 'skipped'
        run: |
          if [ -f data/mediapulse.db ]; then
            python -c "import sqlite3; c = sqlite3.connect('data/mediapulse.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          fi

      - name: Commit results
        if: always() && steps.crawl.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_news.csv data/brand_mentions.csv data/mediapulse.db 2>/dev/null || git add -A daily_news.csv data/ 2>/dev/null || true
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Update pipeline data"
          git pull --rebase
          git push

      - name: Report crawl result
        if: always() && steps.crawl.outcome != 'skipped'
        run: |
          if [ ! -f data/pipeline.log ]; then echo "::error::scraper.py wrote no log — it crashed at start-up (see the Crawl step)"; exit 1; fi
          grep -q "Pipeline complete" data/pipeline.log || { echo "::error::Crawl did not finish — partial results were still saved"; tail -50 data/pipeline.log; exit 1; }
          echo "### Crawl summary" >> "$GITHUB_STEP_SUMMARY"
          grep -E "Pipeline complete|Outlets with nothing|Outlets rested|^.*  - |Saved this run by outlet" data/pipeline.log | sed -E 's/^[0-9-]+ [0-9:,]+ \[INFO\] //' >> "$GITHUB_STEP_SUMMARY" || true
