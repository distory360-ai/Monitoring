name: Daily Data Pipeline

on:
  schedule:
    - cron: "0 20 * * *"  # 11 PM Kenya time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo with Git LFS support
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install sqlalchemy psycopg2-binary

      # 4. Download TextBlob corpora
      - name: Download TextBlob corpora
        run: python -m textblob.download_corpora

      # 5. Run scraper (RAW DATA)
      - name: Run scraper
        run: python scraper.py

      # 6. Run processing pipeline (sends to Neon DB)
      - name: Run data processing
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest.py

      # 7. Track CSVs with LFS, commit, and push
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure LFS tracks CSV files inside the runner environment
          git lfs install
          git lfs track "*.csv"
          git add .gitattributes

          # Stage files
          git add daily_news.csv data/processed_news.csv data/log.txt

          # Commit and push only if changes exist
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update pipeline data"
            git push
          )
